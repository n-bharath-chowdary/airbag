[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airbag"
version = "0.1.0"
description = "A pre-commit / pre-push safety gate for AI-generated code: secrets, repo waste, and unverified changes."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bharath N" }]
keywords = [
    "git", "pre-commit", "hooks", "secrets", "security", "static-analysis",
    "ai", "claude-code", "cursor", "codex", "agents", "devsecops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/n-bharath-chowdary/airbag"
Issues = "https://github.com/n-bharath-chowdary/airbag/issues"

[project.scripts]
airbag = "airbag.cli:main"

[tool.setuptools]
packages = ["airbag", "airbag.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
