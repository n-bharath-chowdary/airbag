name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 and 3.9 are not available on the newest Ubuntu image, so the oldest versions run on 22.04.
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests that make commits
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The built wheel installs and runs on its own
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/airbag --version
